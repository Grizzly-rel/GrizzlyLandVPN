plugins {
    id 'com.android.application'
}

android {
    namespace 'com.grizzlyland.vpn'
    compileSdk 34

    defaultConfig {
        applicationId "com.grizzlyland.vpn"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        release {
            // Пароли подписи — в keystore/keystore.properties (вне репозитория,
            // см. .gitignore). В коде их больше нет.
            def ksProps = new Properties()
            def ksPropsFile = rootProject.file("keystore/keystore.properties")
            if (ksPropsFile.exists()) {
                ksPropsFile.withInputStream { ksProps.load(it) }
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Release signing needs keystore/keystore.properties (outside the repo,
            // see .gitignore). Without it (fresh clone, CI) fall back to debug
            // signing so `gradle assembleRelease` still produces an installable APK.
            signingConfig rootProject.file("keystore/keystore.properties").exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/libxray.aar')
    // SSH-клиент (mwiede-форк jsch) для режима «OpenVPN через SSH».
    implementation files('libs/jsch-2.28.0.jar')
    // QR-коды для настроек WireGuard: сканирование конфига камерой и показ
    // конфига как QR (как в оригинальном приложении WireGuard). Чистая Java,
    // без Android-зависимостей (bytecode Java 8).
    implementation files('libs/zxing-core-3.5.3.jar')
}
